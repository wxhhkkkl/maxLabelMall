<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页与服务支持页 · 设计预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf1ff;color:#0c2148;font-family:"Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid #e3e9f4}strong{margin-right:auto}button{padding:10px 18px;border:1px solid #e3e9f4;border-radius:8px;background:#fff;color:#0c2148;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#2e7cd6;color:#fff}main{padding:24px;text-align:center}img{display:block;width:100%;max-width:1440px;height:auto;margin:auto;box-shadow:0 12px 50px #0c214818}body.actual img{max-width:none;width:auto}p{font-size:13px;color:#5b6c8f}@media(max-width:600px){header{padding:12px;flex-wrap:wrap;gap:8px}strong{width:100%}button{padding:8px 12px}main{padding:12px}}
</style></head>
<body><header><strong>MaxLabel · 页面设计预览</strong><button data-page="home" aria-pressed="true">首页</button><button data-page="support" aria-pressed="false">服务支持</button><button id="zoom" aria-pressed="false">查看原图尺寸</button></header><main><p>第一版视觉方案 · 保留现有头部和底部 · 当前业务页面尚未替换</p><img id="design" src="home-v1.png" alt="首页第一版完整设计图"></main>
<script>
const img=document.querySelector('#design');document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));img.src=button.dataset.page+'-v1.png';img.alt=(button.dataset.page==='home'?'首页':'服务支持页')+'第一版完整设计图';window.scrollTo(0,0)}));document.querySelector('#zoom').addEventListener('click',function(){const actual=document.body.classList.toggle('actual');this.setAttribute('aria-pressed',String(actual));this.textContent=actual?'适应窗口':'查看原图尺寸'});
</script></body></html>

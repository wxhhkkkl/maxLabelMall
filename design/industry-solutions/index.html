<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>赋签 · 十大行业方案设计总览</title><style>*{box-sizing:border-box}body{margin:0;background:#F3F8FF;color:#16233F;font:15px/1.7 "Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid #E3E9F4;padding:24px 5vw}h1{margin:0;font-size:27px;color:#0C2148}header p{margin:8px 0;color:#5B6C8F}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1500px;margin:28px auto;padding:0 24px}nav{position:sticky;top:20px;align-self:start;background:white;padding:12px;border:1px solid #E3E9F4;border-radius:14px}button{display:block;width:100%;text-align:left;border:0;background:white;padding:11px 14px;border-radius:8px;color:#3D4A66;font:inherit;cursor:pointer}button.active{background:#EAF1FF;color:#2E7CD6;font-weight:bold}article{min-width:0}.info{padding:24px;background:white;border-radius:14px;margin-bottom:20px}.info h2{margin:0;color:#0C2148}.info p{margin:8px 0}.info a{display:inline-block;color:white;background:#2E7CD6;border-radius:8px;padding:8px 18px;margin-top:8px;text-decoration:none}.design{width:100%;height:auto;border:1px solid #E3E9F4;border-radius:14px;background:white}@media(max-width:760px){.layout{grid-template-columns:1fr;padding:0 12px}nav{position:static;display:flex;flex-wrap:wrap}button{width:auto;font-size:13px}h1{font-size:22px}}</style><header><h1>赋签 MaxLabel · 十大行业方案设计</h1><p>品牌蓝 × 行业场景 × 标签驱动作业流程 · 2026.10.08 · 设计提案</p></header><main class="layout"><nav id="nav" aria-label="行业选择"></nav><article><section class="info" id="info"></section><img class="design" id="design" alt=""></article></main><script>const items=[["01-warehouse","仓储物流","让每一次流转，都有据可查","收货建档 → 库位上架 → 拣货复核 → 装箱出库","货架与周转箱、扫码枪、标签打印机","库位标签 / SKU标签 / 出库箱标","入库信息重复录入；库位标识不统一；装箱核对费时","以箱为单位串联商品与库位；异常箱单单独复核"],["02-manufacturing","生产制造","从原料到成品，一张标签接力","原料入库 → 工序流转 → 质检标记 → 成品入库","明亮工厂装配线、零件周转盒、工序卡","原料批次标 / 工序流转标 / 成品铭牌","批次信息断点；工序交接依赖手写；补打版本混乱","用批次身份贯穿工序；把待检与放行状态视觉区分"],["03-apparel","服装行业","款色码清晰，门店与仓库同频","款式建档 → 吊牌生成 → 分码入库 → 门店补标","简洁服装店、挂架、针织衣物与服装吊牌","款色码吊牌 / 水洗标 / 包装条码","尺码易混淆；吊牌版式不一致；门店临时补标慢","同款多尺码矩阵生成；吊牌与包装标共用商品信息"],["04-medical","医药与医疗器械","让关键标识，清晰且可核对","资料建档 → 字段核对 → 打印复核 → 记录归档","洁净医疗器械包装工作台、封装盒、标签复核","器械标识 / 批号效期标 / 外箱标签","字段多易遗漏；效期辨识不清；版本核对困难","重点字段分区复核；将批号效期与产品身份关联"],["05-food","食品饮料","把新鲜与批次，一起交到客户手中","产品建档 → 配方核对 → 批次赋码 → 包装贴标","现代饮品包装线、果汁瓶与食品包装","配料信息标 / 批次效期标 / 冷藏箱标","配方调整频繁；日期更新易遗漏；冷藏标识不清","固定配方与变量日期分层；批次信息随包装流转"],["06-retail","零售门店","一次改价，让货架表达一致","商品导入 → 价格更新 → 分区打印 → 上架核对","明亮精品超市货架、整齐价签、小型桌面打印机","货架价签 / 促销标签 / 商品条码","价签与商品错位；促销结束忘换标；改价任务分散","按货架分区组织改价任务；促销期限突出显示"],["07-crossborder","跨境电商","多仓多规则，出货依然有序","订单整理 → 规则选版 → 商品贴标 → 箱单复核","跨境仓包装台、国际货运纸箱、世界线路小图","商品识别标 / 物流箱标 / 仓库分区标","不同渠道版式多；箱内商品核对繁琐；补标难定位","渠道规则与数据分离；一箱一清单配对复核"],["08-bakery","烘焙行业","让今日出炉，成为看得见的安心","配方建档 → 当日生产 → 包装贴标 → 陈列更新","温暖洁净面包店、牛皮纸包装、可颂与面包","产品信息标 / 生产时间标 / 陈列价签","短效期更新频繁；过敏原信息不显眼；门店标签风格不一","突出生产时点与储存提示；标签与陈列共享产品档案"],["09-catering","餐饮供应链","从收货到备餐，鲜度交接更清楚","供应收货 → 分装标记 → 冷藏周转 → 领料核对","中央厨房冷藏工作台、食材周转盒、清晰日期标签","食材收货标 / 分装备餐标 / 周转箱标","分装后来源难查；冷藏盒日期不清；交接靠口头","分装关联来源批次；用时间轴提示周转先后"],["10-semiconductor","电子半导体","小到一盘料，也有完整身份","来料核对 → 料盘赋码 → 生产领用 → 包装交付","精密电子车间、芯片料盘、电子元器件与防静电袋","料盘标签 / 防静电袋标 / 产品序列标","微小物料识别难；供应商标签不统一；序列关联容易断点","建立料盘与批次对应关系；多规格标签共享字段规范"]];const nav=document.getElementById('nav');function show(i){const a=items[i];document.querySelectorAll('button').forEach((b,n)=>{b.classList.toggle('active',n===i);b.setAttribute('aria-pressed',String(n===i))});document.getElementById('info').innerHTML='<h2>'+a[1]+' · '+a[2]+'</h2><p><strong>流程：</strong>'+a[3]+'</p><p><strong>标签：</strong>'+a[5]+'</p><p><strong>设计亮点：</strong>'+a[7]+'</p><a href="'+a[0]+'.png" target="_blank" rel="noopener">查看原图</a>';const img=document.getElementById('design');img.src=a[0]+'.png';img.alt=a[1]+'解决方案页面设计图'}items.forEach((a,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+a[1];b.onclick=()=>show(i);nav.appendChild(b)});show(0);</script></html>

# 应用机：/opt/maxlabel/logs/app.log 的轮转
#
# 安装位置：/etc/logrotate.d/maxlabel
#
# 为什么必须轮转：这份日志是 systemd 用 `StandardOutput=append:` 打开的，
# 应用本身不轮转。2026-11-01 它已经涨到 7.2G，把根分区写满后 nginx 无法写
# client_body_temp / proxy_temp —— 图片上传 500、地区树响应被截断。
#
# 为什么用 copytruncate：进程不认 SIGHUP、也不会重新 open 这个文件；
# 用 rename 的话 systemd 会继续往旧 inode 写，新文件永远是空的。
/opt/maxlabel/logs/app.log {
    size 200M
    rotate 7
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}

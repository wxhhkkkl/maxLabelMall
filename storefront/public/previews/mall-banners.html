<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>赋签 · 商城 Banner 预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#0c2148;font-family:"Microsoft YaHei",system-ui,sans-serif}header{height:76px;background:#fff;border-bottom:1px solid #e6ecf5;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2));gap:20px}header a{display:flex;gap:10px;align-items:center;text-decoration:none;color:#0c2148;font-size:20px;font-weight:700}header img{width:36px;height:36px}header span{font-size:13px;color:#6d7f9e;font-weight:400}main{max-width:1200px;margin:36px auto 64px;width:calc(100% - 48px)}.intro{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.intro h1{font-size:24px;margin:0 0 8px}.intro p{font-size:14px;color:#7585a1;margin:0}.download{color:#2e7cd6;text-decoration:none;font-size:13px;white-space:nowrap}.banner{position:relative;isolation:isolate;height:220px;overflow:hidden;border-radius:16px;background:#eef5fc;border:1px solid #e2eaf4;box-shadow:0 12px 32px #183f7410}.banner-photo{position:absolute;top:50%;right:0;width:100%;height:280px;object-fit:contain;object-position:right center;transform:translateY(-50%);z-index:-2}.banner::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#f3f8fd 0%,#f3f8fdf2 35%,#f3f8fd00 55%)}.banner-copy{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:22px 46px;width:54%}.brand{font-size:12px;letter-spacing:.06em;color:#336596;margin:0 0 10px}.banner h2{font-size:30px;line-height:1.35;letter-spacing:-.04em;margin:0;font-weight:750;white-space:nowrap}.banner h2 span{display:block}.banner .subtitle{font-size:13px;color:#617897;margin:10px 0}.coming{display:inline-flex;background:#e1edfc;color:#3477c3;padding:4px 10px;border-radius:20px;font-size:10px;line-height:1.3}.caption{margin:18px 0 0;font-size:13px;color:#6d7f9e;line-height:1.8}.export-mode main{width:1200px;max-width:none;margin:0}.export-mode header,.export-mode .intro,.export-mode .caption{display:none}.export-mode .banner{border-radius:0;border:0;box-shadow:none}a:focus-visible{outline:3px solid #2e7cd6;outline-offset:4px}@media(max-width:768px){header{height:64px;padding-inline:20px}header span{font-size:11px}main{width:calc(100% - 32px);margin-top:24px}.intro{align-items:flex-start;flex-direction:column;gap:12px}.intro h1{font-size:21px}.intro p{font-size:12px}.banner{height:220px;border-radius:12px}.banner-photo{top:auto;right:0;bottom:0;width:100%;height:150px;object-fit:contain;object-position:right bottom;transform:none;z-index:-2}.banner::after{background:linear-gradient(90deg,#f3f8fd 0%,#f3f8fdd9 35%,#f3f8fd00 75%)}.banner-copy{padding:22px 20px;width:100%;justify-content:flex-start}.brand{font-size:10px;margin-bottom:10px}.banner h2{font-size:24px;line-height:1.35}.banner h2 span{font-size:19px;margin-top:3px}.banner .subtitle{font-size:10px;margin-top:10px;margin-bottom:9px}.coming{font-size:9px}.caption{font-size:12px}}
</style>
</head>
<body>
<header><a href="/mall"><img src="/assets/logo.png" alt="">赋签 <span>MaxLabel</span></a><span>商城 Banner · 设计预览</span></header>
<main>
<div class="intro"><div><h1>从设计到打印</h1><p>只保留这一张 · 固定高度 220px</p></div><a class="download" href="/assets/mall-banners/01-one-stop-220.png" download>下载 220px 版 Banner ↓</a></div>
<section class="banner" aria-label="从设计到打印，每一步都有好搭档">
<img class="banner-photo" src="/assets/mall-banners/one-stop-background.webp" alt="标签软件、打印机、标签纸与碳带的组合场景">
<div class="banner-copy"><p class="brand">赋签 | MaxLabel</p><h2>从设计到打印<span>每一步，都有好搭档</span></h2><p class="subtitle">标签软件 · 打印设备 · 标签耗材</p><span class="coming">MaxLabel 软件开发中</span></div>
</section>
<p class="caption">保持商城现有 220px 高度。文案与产品为横向构图，原尺寸导出 1200 × 220，另提供 2400 × 440 高清版。</p>
</main>
<script>if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export-mode')</script>
</body></html>

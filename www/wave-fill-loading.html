  /* 底层：淡色 logo 轮廓，让形状在未灌满时始终可见 */
  .la-ghost {
    background: linear-gradient(160deg, #009944, #0A6EB8 55%, #000036);
    opacity: .13;
  }
  .la-mask { overflow: hidden; }

  /* 水位升降容器：bottom 从 -8%（空）→ 108%（满），往返循环 */
  .la-lift {
    position: absolute; left: 50%; bottom: -8%;
    width: 0; height: 0;
    animation: laRise 5.2s cubic-bezier(.45, .05, .35, .95) infinite alternate;
  }
  /* 主波面：静态三色渐变（绿浪尖→蓝→藏青水深），仅轻微水平摆动，
     不旋转——避免渐变方向跟盘旋转导致颜色层次漂移 */
  .la-wave {
    position: absolute; top: 0; left: -260px;
    width: 520px; height: 520px;
    border-radius: 42% 44% 41% 45%;
    background: linear-gradient(180deg, #009944 0%, #0A6EB8 9%, #000036 48%);
    animation: laSway 4.5s ease-in-out infinite alternate;
  }
  /* 副波面：半透明白色波盘反向旋转，制造浪尖涌动的光泽 */
  .la-wave.w2 {
    background: rgba(255, 255, 255, .16);
    border-radius: 46% 43% 47% 42%;
    animation: laSpinRev 11s linear infinite;
  }

  @keyframes laRise {
    0%   { bottom: -8%; }
    100% { bottom: 108%; }
  }
  @keyframes laSway    { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
  @keyframes laSpinRev { from { transform: rotate(360deg); }    to { transform: rotate(0deg); } }

  /* ---- 百分比与文案 ---- */
  .la-pct {
    font-size: 16px; font-weight: 600; letter-spacing: 2px;
    color: #0A6EB8; font-variant-numeric: tabular-nums;
  }
  .la-text {
    margin-top: -16px;
    font-size: 12.5px; color: #8A96A5; letter-spacing: 4px;
  }
</style>
</head>
<body>

<div class="la-stage">
  <div class="la-ghost"></div>
  <div class="la-mask">
    <div class="la-lift">
      <div class="la-wave w1"></div>
      <div class="la-wave w2"></div>
    </div>
  </div>
</div>
<div class="la-pct" id="laPct">0%</div>
<div class="la-text">正在加载</div>

<script>
  /* 百分比演示：与 laRise 5.2s 交替动画同步 0→100→0。
     实际项目中可改为对接真实加载进度：
     直接设置 document.getElementById('laPct').textContent = progress + '%'，
     并移除本定时器。 */
  (function () {
    var el = document.getElementById('laPct');
    var DURATION = 5200, start = performance.now();
    function tick(now) {
      var t = ((now - start) / DURATION) % 2;      // 0~2 循环
      var p = t <= 1 ? t : 2 - t;                   // 往返
      var eased = p * p * (3 - 2 * p);              // 平滑缓动
      el.textContent = Math.round(eased * 100) + '%';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>

</body>
